[tool.poetry]
name = "ocabox"
version = "2.7.1" # Change version also in ocabox_bases.py and CHANGELOG.md
license = "MIT"
description = ""
authors = ["Ernest Lasek <elasek@akond.com>, Mikołaj Kałuszyński <mkalusz@camk.edu.pl>"]
readme = "README.md"
repository = "https://github.com/araucaria-project/ocabox"
keywords = ["ocabox"]
packages = [
    { include = "ob" },
#    { include = "examples" },
#    { include = "test" },
    { include = "ocaboxapi" },
]

[tool.poetry.dependencies]
python = "^3.10"
ocabox-common = {git = "https://github.com/araucaria-project/ocabox-common.git"}
confuse = ">=1.7.0"
astropy = ">=1.6.0"
pyaraucaria = {git = "https://github.com/araucaria-project/pyaraucaria.git"}
ctc = {git = "https://github.com/araucaria-project/ctc.git"}
serverish = {version = "^2.0.0", extras = ["messenger"]}




[tool.poetry.scripts]
tests = "test.run_tests:main"
cmd_client = "ob.cmd_client:main"
cmd_simple_client = "ob.cmd_simple_client:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
