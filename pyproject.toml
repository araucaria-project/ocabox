[tool.poetry]
name = "ocabox"
version = "0.1.1"
license = "MIT"
description = ""
authors = ["Ernest Lasek <elasek@akond.com>, Mikołaj Kałuszyński <mkalusz@camk.edu.pl>"]
readme = "README.md"
repository = "https://github.com/araucaria-project/ocabox"
keywords = ["ocabox"]
packages = [
    { include = "ob" },
    { include = "examples" },
    { include = "test" },
]

[tool.poetry.dependencies]
python = "^3.8"
pyzmq = ">=22.3.0,<22.4.0"
msgpack = ">=1.0.3,<1.1.0"
confuse = ">=1.7.0,<1.8.0"
astropy = ">=5.0.4,<5.1.0"
aiohttp = ">=3.8.1,<3.9.0"
qasync = { version = ">=0.23.0", optional = true }
PyQt5 = { version = ">=5.15.7,<5.16.0", optional = true }

[tool.poetry.extras]
examples = ["qasync", "PyQt5"]

[tool.poetry.scripts]
tests = "test.run_tests:main"
cmd_client = "ob.cmd_client:main"
cmd_simple_client = "ob.cmd_simple_client:main"
server = "ob.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
