[tool.poetry]
name = "ocabox"
version = "2.2.2"
license = "MIT"
description = ""
authors = ["Ernest Lasek <elasek@akond.com>, Mikołaj Kałuszyński <mkalusz@camk.edu.pl>"]
readme = "README.md"
repository = "https://github.com/araucaria-project/ocabox"
keywords = ["ocabox"]
packages = [
    { include = "ob" },
    { include = "examples" },
    { include = "test" },
    { include = "ocaboxapi" },
]

[tool.poetry.dependencies]
python = "^3.9"
pyzmq = "^25.0.2"
ocabox-common = {git = "https://github.com/araucaria-project/ocabox-common.git"}
confuse = ">=1.7.0,<1.8.0"
astropy = "^6.0.0"
qasync = { version = ">=0.23.0", optional = true }
PyQt5 = { version = ">=5.15.7,<5.16.0", optional = true }
pylint = {version = "^2.16.2", optional = true}
graphviz = {version = "^0.20.1", optional = true}
pyaraucaria = {git = "https://github.com/araucaria-project/pyaraucaria.git"}
ctc = {git = "https://github.com/araucaria-project/ctc.git"}
jupyter = {version = "^1.0.0", optional = true}
requests = {version = "^2.30.0", optional = true}
scikit-learn = ">=1.3.0"
serverish = {version = "^1.1.1", extras = ["messenger"]}
astroplan = "^0.9.0"


[tool.poetry.extras]
examples = ["qasync", "PyQt5"]
develop = ['pylint', 'graphviz']
jupyter = ["jupyter", "requests"]


[tool.poetry.scripts]
tests = "test.run_tests:main"
cmd_client = "ob.cmd_client:main"
cmd_simple_client = "ob.cmd_simple_client:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
