LOG_LEVEL: INFO

OCABOX_BUILD_FILE_NAME: "tree_build_example.py"   # file name witch tree build plans, this property can be set only in configuration/config.yaml or environment property

router:
  DefaultRouter:
    port: 5559
    url: '*'
    protocol: tcp
    timeout: 30
  SampleTestRouter:
    port: 5560
    url: '*'
    protocol: tcp
    timeout: 1

client:
  TOI_Client:
    port: 5558
    url: tic.oca.lan
    protocol: tcp
    timeout: 30
    time_of_data_tolerance: 0.5  # extra, not used by ocabox
    request_timeout: 5.1  # extra, not used by ocabox
    delay: 0.1  # extra, not used by ocabox
    max_missed_msg: 3  # extra, not used by ocabox
  CliClient:
    port: 5558
    url: tic.oca.lan
    protocol: tcp
    timeout: 31.7
    time_of_data_tolerance: 0.5  # extra, not used by ocabox
    request_timeout: 2.17  # extra, not used by ocabox
    delay: 0.1  # extra, not used by ocabox
    max_missed_msg: 3  # extra, not used by ocabox
    app:
      base_fits_dir: ~/Desktop
  DefaultClient:
    port: 5559
    url: localhost
    protocol: tcp
    timeout: 30
    time_of_data_tolerance: 0.5  # extra, not used by ocabox
    request_timeout: 2.16  # extra, not used by ocabox
    delay: 0.1  # extra, not used by ocabox
    max_missed_msg: 3  # extra, not used by ocabox
  SampleTestClient:
    port: 5560
    url: localhost
    protocol: tcp
    timeout: 1

comunication:
  ConditionalCycleQuery:
    default_delay: 5
    max_missed_msg: 3
    request_timeout: 30
  PeriodicCycleQuery:
    default_delay: 5
    max_missed_msg: 3
    request_timeout: 30
    min_delay: 0.5

data_collection:
  ValueRequest:
    default_request_timeout: 30
    time_of_data_tolerance: 60
  TreeAlpacaObservatory:
    timeout_multiplier: 0.8  # this should be 0 < x < 1
    address: localhost:80
    api_version: 1
    url_protocol: http
  TreeBaseRequestBlocker:
    default_control_time: 60
    max_control_time: 86400 # 24h
    white_list:
      GET: []
      PUT: []
    black_list:
      GET: []
      PUT: []
  TreeConditionalFreezer:
    max_unsuccessful_refreshes: 10
    alarm_timeout: 2 # WARNING, the value should be greater than the overall timeout
    min_time_of_data_tolerance: 0.2 # !!! Never set to 0 or less
  TreeCache:
    no_cachable_regex:
      - .*\.is_access$

tree:
  test_sample_blocker:
    white_list:
      GET: []
      PUT:
        - telescope.some_val
        - telescope.some_val2
    black_list:
      GET:
        - telescope.some_val3
        - telescope.some_val4
  test_sample_freezer:
    max_unsuccessful_refreshes: 10
    alarm_timeout: 2
    min_time_of_data_tolerance: 0.2

  test_observatory:
    observatory:
      comment: Simulated observatory for tests
      lon: 12.345    # Paranal
      lat: 67.890
      elev: 2635.0
      protocol: alpaca
      address: http://localhost:80/api/v1
      components:
        dibi:
          kind: telescope
          comment: DIBI Autoslew Simulated Telescope
          device_number: 0
          components:
            derotator:
              kind: rotator
              device_number: 0
        dome:
          kind: dome
          device_number: 0
  test_observatory_down:
    observatory:
      comment: Simulated observatory for tests
      lon: 12.345    # Paranal
      lat: 67.890
      elev: 2635.0
      protocol: alpaca
      address: http://10.255.255.1/api/v1  # this url address should return connection timeout error
      components:
        dibi:
          kind: telescope
          comment: DIBI Autoslew Simulated Telescope
          device_number: 0
          components:
            derotator:
              kind: rotator
              device_number: 0