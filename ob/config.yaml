router:
  DefaultRouter:
    port: 5559
    url: '*'
    protocol: tcp
    timeout: 30
  SampleTestRouter:
    port: 5560
    url: '*'
    protocol: tcp
    timeout: 1

client:
  DefaultClient:
    port: 5559
    url: localhost
    protocol: tcp
    timeout: 30
  SampleTestClient:
    port: 5560
    url: localhost
    protocol: tcp
    timeout: 1

data_collection:
  ValueRequest:
    default_request_timeout: 30
    time_of_data_tolerance: 60
  TreeAlpacaObservatory:
    address: localhost:80
    api_version: 1
    url_protocol: http
  TreeRequestAlpacaBlocker:
    reservation_length: 60
    white_list:
      GET: []
      PUT: []
    black_list:
      GET: []
      PUT: []

tree:
  test_sample_blocker:
    white_list:
      GET: []
      PUT:
        - telescope.some_val
        - telescope.some_val2
    black_list:
      GET:
        - telescope.some_val3
        - telescope.some_val4

test_observatory:
  observatory:
    comment: Simulated observatory for tests
    lon: 12.345    # Paranal
    lat: 67.890
    elev: 2635.0
    protocol: alpaca
    address: http://localhost:80/api/v1
    components:
      dibi:
        kind: telescope
        comment: DIBI Autoslew Simulated Telescope
        device_number: 0
        components:
          derotator:
            kind: rotator
            device_number: 0