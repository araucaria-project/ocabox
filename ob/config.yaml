router:
  DefaultRouter:
    port: 5559
    url: '*'
    protocol: tcp
    timeout: 30
  SampleTestRouter:
    port: 5560
    url: '*'
    protocol: tcp
    timeout: 1

client:
  DefaultClient:
    port: 5559
    url: localhost
    protocol: tcp
    timeout: 30
  SampleTestClient:
    port: 5560
    url: localhost
    protocol: tcp
    timeout: 1

data_collection:
  ValueRequest:
    default_request_timeout: 30
    time_of_data_tolerance: 60
  TreeAlpacaObservatory:
    address: localhost:80
    api_version: 1
    url_protocol: http

tree:
  my_observatory:
    address: localhost:80
    api_version: 1
    url_protocol: http