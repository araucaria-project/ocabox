        camera:
          kind: camera
          device_number: 0
        guider:
          kind: camera
          device_number: 1
        filterwheel:
          kind: filterwheel
          device_number: 0
          filters : {u: 0, g: 1, r: 2, i: 3, z: 4, B: 5, V: 6, Ic: 7}  # optional
        switch:
          kind: switch
          device_number: 0
        safetymonitor:
          kind: safetymonitor
          device_number: 0

