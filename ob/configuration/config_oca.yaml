nats:
  host: "nats.oca.lan"
  port: 4222


data_collection:
  TreeCCTV:   # Ubiquity CCTV camera
    udm_camera_id: ''
    udm_host: sudm.oca.lan
    udm_port: 443
    udm_user: api
    udm_password: ''

tree:
  wk06:
    observatory:
      comment: Wojtek Krzemiński 0.6m Telescope
      lon: -24.59806    # OCA
      lat: -70.19638
      elev: 2817  # m
      epoch: 2000
      protocol: alpaca
      address: http://wk06-tcu.oca.lan:11111/api/v1
      components:
        mount:
          kind: telescope
          device_number: 0
        derotator:
          kind: rotator
          device_number: 0  #  address will be taken from parent if not provided
        focuser:
          kind: focuser
          device_number: 0
        dome:
          kind: dome
          device_number: 0
        covercalibrator:
          kind: covercalibrator
          device_number: 0
        camera:
          kind: camera
          device_number: 0
        guider:
          kind: camera
          device_number: 1
        filterwheel:
          kind: filterwheel
          device_number: 0
          filters: {}  # optional
        switch:
          kind: switch
          device_number: 0
        safetymonitor:
          kind: safetymonitor
          device_number: 0

  zb08:
    observatory:
      comment: Zbigniew Zibi Kołaczkowski 0.8m Telescope
      lon: -24.59806    # OCA
      lat: -70.19638
      elev: 2817  # m
      epoch: 2000
      protocol: alpaca
      address: http://zb08-tcu.oca.lan:11111/api/v1
