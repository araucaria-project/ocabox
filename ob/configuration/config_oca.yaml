CliClient:
  port: 5558
  url: tic.oca.lan
  protocol: tcp
  timeout: 31.7
  time_of_data_tolerance: 0.5
  request_timeout: 2.17
  delay: 0.1
  max_missed_msg: 3


router:
  Router-OCA:
    port: 5558
    timeout: 30
    ping-tasks-enabled: True
    ping-tasks-interval: 30.0
